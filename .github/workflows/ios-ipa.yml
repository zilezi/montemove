name: iOS unsigned IPA (for AltStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/MonteMove.xcworkspace \
            -scheme MonteMove \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log | grep -E "^(Build|Compile|Link|PhaseScript|error:|warning: .*\.swift|\*\*)" | tail -n 120

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/MonteMove.app"
          test -d "$APP" || { echo "::error::App bundle not found — build failed"; exit 1; }
          test -f "$APP/MonteMove" || { echo "::error::App bundle is empty/incomplete"; exit 1; }
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry montemove-unsigned.ipa Payload
          ls -lh montemove-unsigned.ipa

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-full-log
          path: build.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: montemove-unsigned-ipa
          path: montemove-unsigned.ipa
          retention-days: 30
