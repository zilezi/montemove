name: iOS unsigned IPA (for AltStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -workspace ios/MonteMove.xcworkspace \
            -scheme MonteMove \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -n 40

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MonteMove.app Payload/
          zip -qry montemove-unsigned.ipa Payload
          ls -lh montemove-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: montemove-unsigned-ipa
          path: montemove-unsigned.ipa
          retention-days: 30
